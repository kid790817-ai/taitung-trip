<style>
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:#16202B;color:#F3EBD8;font-family:'Noto Sans TC',-apple-system,'PingFang TC',sans-serif;min-height:100vh}
.wrap{max-width:480px;margin:0 auto;padding:calc(56px + env(safe-area-inset-top)) 20px 40px}
.stripes{display:flex;gap:5px;margin-bottom:12px}.stripes i{height:7px;display:block}
h1{font-size:34px;font-weight:900;line-height:1.2}
.date{margin:4px 0 34px;font-family:'JetBrains Mono',monospace;font-size:17px;color:#F2B33D}
.gate{position:relative;background:#F3EBD8;color:#16202B;border-radius:16px;overflow:hidden;transform:rotate(-1.5deg)}
.gate.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:rotate(-1.5deg) translateX(0)}20%,60%{transform:rotate(-1.5deg) translateX(-12px)}40%,80%{transform:rotate(-1.5deg) translateX(12px)}}
.gate .top{background:#E8692C;padding:12px 18px;font-size:15px;letter-spacing:3px;font-weight:700}
.gate .in{padding:20px 18px 22px;border-bottom:3px dashed #c9bfa6}
.gate h2{font-size:28px;font-weight:900}
.gate p{font-size:17px;color:#5d5442;margin-top:4px}
.boxes{display:flex;gap:10px;margin-top:18px}
.boxes span{flex:1;height:64px;border-radius:12px;border:3px solid #16202B;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:32px;font-weight:700}
.boxes span.f{background:#16202B;color:#F3EBD8}
#pw{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0;background:transparent;color:transparent;caret-color:transparent}
.gate .stub{display:flex;justify-content:space-between;padding:12px 18px;font-size:15px;color:#7d725a}
.btn{display:flex;width:100%;margin-top:26px;height:60px;border:0;border-radius:14px;background:#E8692C;color:#16202B;align-items:center;justify-content:center;font:inherit;font-size:21px;font-weight:900;cursor:pointer}
.msg{text-align:center;font-size:16px;color:#8696A7;margin-top:16px;line-height:1.6;min-height:26px}
.msg.err{color:#F2B33D;font-weight:700}
</style>

eYoGBDBz+ZMzxP9D0mQOWZ2TkV/IV55jddhQ0EQlVj9Bf51GIlg0bxc9Z", KEY="tt-pass";
var pw=document.getElementById('pw'), boxes=document.getElementById('boxes').children, msg=document.getElementById('msg'), gate=document.getElementById('gate');
function b(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
function draw(){for(var i=0;i<4;i++){var f=i<pw.value.length;boxes[i].className=f?'f':'';boxes[i].textContent=f?'●':''}}
async function unlockWith(p){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(SALT),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  var html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b(IV)},key,b(CT)));
  try{localStorage.setItem(KEY,p)}catch(e){}
  document.open();document.write(html);document.close();
}
async function tryOpen(){
  var p=pw.value.replace(/\D/g,'');
  if(p.length<4){msg.className='msg err';msg.textContent='要輸入四位數字';return}
  msg.className='msg';msg.textContent='剪票中⋯';
  try{await unlockWith(p)}catch(e){
    msg.className='msg err';msg.textContent='密碼不對，再輸入一次';
    gate.classList.remove('shake');void gate.offsetWidth;gate.classList.add('shake');
    pw.value='';draw();pw.focus();
  }
}
pw.addEventListener('input',function(){pw.value=pw.value.replace(/\D/g,'').slice(0,4);draw();if(pw.value.length===4)tryOpen()});
document.getElementById('go').addEventListener('click',tryOpen);
(async function(){
  var saved=null;try{saved=localStorage.getItem(KEY)}catch(e){}
  if(saved){msg.textContent='開啟中⋯';try{await unlockWith(saved);return}catch(e){try{localStorage.removeItem(KEY)}catch(e2){}msg.textContent='點上面的票，輸入四位數字'}}
})();
</script>
